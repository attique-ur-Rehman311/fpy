<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Data Analyst System</title>

<style>
*{
    box-sizing:border-box;
    font-family:Segoe UI, Arial;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#4655e0,#6a82fb);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.card{
    width:380px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

/* TITLE */
.card h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

/* INPUT */
input{
    width:100%;
    padding:11px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}
input:focus{
    outline:none;
    border-color:#4655e0;
}

/* BUTTON */
button{
    width:100%;
    padding:11px;
    background:#4655e0;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#2f3acb;
}

/* TEXT */
p{
    text-align:center;
    margin-top:15px;
}
a{
    color:#4655e0;
    text-decoration:none;
    font-weight:600;
}
a:hover{text-decoration:underline}

/* TOGGLE */
.hidden{display:none}

/* ERROR */
.error{
    color:red;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<!-- LOGIN FORM -->
<div id="loginBox">
    <h2>🔐 Login</h2>

    <form method="POST" action="/">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <p>
        Don’t have an account?
        <a href="#" onclick="showRegister()">Register</a>
    </p>
</div>

<!-- REGISTER FORM -->
<div id="registerBox" class="hidden">
    <h2>📝 Register</h2>

    <form method="POST" action="/register/">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="#" onclick="showLogin()">Login</a>
    </p>
</div>

</div>

<script>
function showRegister(){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
}
function showLogin(){
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}
</script>

</body>
</html>
